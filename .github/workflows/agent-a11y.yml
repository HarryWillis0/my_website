name: 'Accessibility agent'
on:
  push:
    branches:
      - main
    paths:
      - 'frontends/**'

# detect audits the merge and files deduped `accessibility` issues; fix then resolves up to 5 of them directly on main.
jobs:
  detect:
    # Kill switch + loop guard on the commit marker; the app-bot actor check runs as a step once its slug is known.
    if: vars.A11Y_AGENT_ENABLED == 'true' && !contains(github.event.head_commit.message, '[a11y-agent]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      filed: ${{ steps.filed.outputs.count }}
    steps:
      - name: 'Mint GitHub App token'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 'Skip runs triggered by the app bot'
        id: guard
        env:
          ACTOR: ${{ github.actor }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          if [ "$ACTOR" = "$BOT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Checkout Repo'
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'List changed frontend files'
        id: changed
        if: steps.guard.outputs.skip != 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only --diff-filter=d "$BEFORE" "$GITHUB_SHA" -- frontends/
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 'Record highest issue number'
        id: before
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "max=$(gh issue list --state all --limit 1 --json number --jq '.[0].number // 0')" >> "$GITHUB_OUTPUT"

      - name: 'Audit changed files'
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Read .claude/skills/a11y-audit/SKILL.md and follow it to audit the files changed in this merge (commit ${{ github.sha }}).
            Changed files under frontends/:
            ${{ steps.changed.outputs.files }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh label list:*),Bash(gh label create:*)"

      - name: 'Count issues filed'
        id: filed
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MAX: ${{ steps.before.outputs.max }}
        run: |
          count=$(gh issue list --label accessibility --state open --limit 200 --json number --jq "[.[] | select(.number > $MAX)] | length")
          echo "count=$count" >> "$GITHUB_OUTPUT"

  fix:
    needs: detect
    if: needs.detect.outputs.filed != '' && needs.detect.outputs.filed != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 'Mint GitHub App token'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The app token is used for checkout so the later push triggers CI (GITHUB_TOKEN pushes do not).
      - name: 'Checkout Repo'
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: 'Configure git identity'
        env:
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "$SLUG[bot]"
          git config user.email "$SLUG[bot]@users.noreply.github.com"

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/svelte/package-lock.json

      - name: 'Install dependencies'
        run: npm ci
        working-directory: ./frontends/svelte

      - name: 'Fix accessibility issues'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Read .claude/skills/implement-a11y/SKILL.md and follow it. Fix at most 5 open accessibility issues.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh label list:*),Bash(gh label create:*),Bash(npm run format:*),Bash(npm run check:*),Bash(npm run lint:*),Bash(npm test:*),Bash(npx vitest:*),Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git checkout:*),Bash(git clean:*)"

      - name: 'Push fixes to main'
        run: |
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
