name: 'Accessibility agent'
on:
  push:
    branches:
      - main
    paths:
      - 'frontends/**'

# Detect-only: audits the files changed in the merge and files deduped `accessibility` issues.
jobs:
  detect:
    # Kill switch + loop guard on the commit marker; the app-bot actor check runs as a step once its slug is known.
    if: vars.A11Y_AGENT_ENABLED == 'true' && !contains(github.event.head_commit.message, '[a11y-agent]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: 'Mint GitHub App token'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 'Skip runs triggered by the app bot'
        id: guard
        env:
          ACTOR: ${{ github.actor }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          if [ "$ACTOR" = "$BOT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Checkout Repo'
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'List changed frontend files'
        id: changed
        if: steps.guard.outputs.skip != 'true'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          {
            echo 'files<<EOF'
            git diff --name-only --diff-filter=d "$BEFORE" "$GITHUB_SHA" -- frontends/
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 'Audit changed files'
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Use the a11y-audit skill to audit the files changed in this merge (commit ${{ github.sha }}).
            Changed files under frontends/:
            ${{ steps.changed.outputs.files }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Skill,Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh label list:*),Bash(gh label create:*)"
